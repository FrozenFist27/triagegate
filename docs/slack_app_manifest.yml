# Slack app manifest for TriageGate (no secrets). Create via: api.slack.com/apps -> Create New App -> From a manifest.
display_information:
  name: triagegate
  description: Human approval for AI-triaged inbound email (synthetic data)
  background_color: "#1f2937"
features:
  bot_user:
    display_name: triagegate
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write          # post the approval card and update it after a decision
settings:
  interactivity:
    is_enabled: true
    # Socket Mode: no request_url. For the HTTP alternative (SLACK_MODE=http) set
    # socket_mode_enabled: false and add request_url: https://<tunnel>/webhook/slack-actions
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
